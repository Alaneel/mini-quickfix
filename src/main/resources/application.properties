# Mini QuickFIX Configuration

# Application Settings
app.name=Mini QuickFIX
app.version=1.0.0
app.description=Lightweight FIX Protocol Library for Java

# FIX Session Configuration
fix.session.heartbeat.interval=30
fix.session.reconnect.interval=5
fix.session.max.reconnect.attempts=10

# Network Configuration
fix.network.host=localhost
fix.network.port=9878
fix.network.timeout=30000
fix.network.buffer.size=8192

# Message Store Configuration
fix.store.enabled=true
fix.store.path=./fix_store
fix.store.max.messages=10000

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.fix=INFO
logging.file.name=logs/mini-quickfix.log
logging.file.max-size=10MB
logging.file.max-history=30

# Performance Settings
fix.performance.async.enabled=true
fix.performance.thread.pool.size=10
fix.performance.queue.size=1000

# Security Settings
fix.security.encryption.enabled=false
fix.security.ssl.enabled=false
fix.security.ssl.keystore.path=
fix.security.ssl.keystore.password=
